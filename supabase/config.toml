project_id = "gota"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Requerido por docs/SETUP.md (Anonymous Sign-ins) para el arranque de la app.
enable_anonymous_sign_ins = true

# Sprint 06: entrega push de notifications. La invoca el Database Webhook
# (trigger vía supabase_functions.http_request) con el service role key;
# por eso verifica JWT. Los secretos FCM (FCM_SERVICE_ACCOUNT_JSON) se
# inyectan con `supabase secrets set` y NO viven en este archivo ni en Git
# (docs/SETUP.md).
[functions.notify-push]
verify_jwt = true
